# Docker Compose configuration for production deployment of Price Tracker SaaS Generated by DeepSeek
services:
  caddy:
    image: caddy:2-alpine
    container_name: price-tracker-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-tracker-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-pricetracker}:${DB_PASS}@db:5432/${DB_NAME:-pricetracker}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://price.vectobody.com
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_PERSONAL_PRICE_ID=${PADDLE_PERSONAL_PRICE_ID}
      - PADDLE_PRO_PRICE_ID=${PADDLE_PRO_PRICE_ID}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - INNGEST_APP_ID=${INNGEST_APP_ID}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
      - EBAY_APP_ID=${EBAY_APP_ID}
      - EBAY_CERT_ID=${EBAY_CERT_ID}
      - NEXT_PUBLIC_APP_URL=https://price.vectobody.com
      - CRON_SECRET=${CRON_SECRET}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: price-tracker-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER:-pricetracker}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME:-pricetracker}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-pricetracker} -d ${DB_NAME:-pricetracker}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: price-tracker-migrate
    command: sh -c "pnpm db:migrate"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-pricetracker}:${DB_PASS}@db:5432/${DB_NAME:-pricetracker}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - migrate

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge

