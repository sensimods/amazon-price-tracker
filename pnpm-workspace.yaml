# This tells the modern PNPM inside Docker that these packages are safe to build
allowBuilds:
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Included as a fallback just in case it pulls a late v10 version instead
onlyBuiltDependencies:
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
